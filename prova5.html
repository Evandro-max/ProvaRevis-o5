<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
</head>
<body>
    <script>
        let tarefas = [];

        function gerenciarTarefas() {
            let acao = prompt("Escolha uma ação: Adicionar, Listar, Remover, Concluir, Sair").toLowerCase();

            if (acao === "adicionar") {
                let tarefa = prompt("Digite o nome da tarefa");
                tarefas.push(tarefa);
                gerenciarTarefas();
            } else if (acao === "listar") {
                if (tarefas.length === 0) {
                    alert("Nenhuma tarefa adicionada ainda");
                } else {
                    let lista = "";
                    for (let i = 0; i < tarefas.length; i++) {
                        lista += i + ": " + tarefas[i] + "\n";
                    }
                    alert("Tarefas:\n" + lista);
                }
                gerenciarTarefas();
            } else if (acao === "remover") {
                let indice = prompt("Digite o índice da tarefa a ser removida");
                if (indice >= 0 && indice < tarefas.length) {
                    tarefas.splice(indice, 1);
                    alert("Tarefa removida com sucesso");
                } else {
                    alert("Índice inválido.");
                }
                gerenciarTarefas();
            } else if (acao === "concluir") {
                let indice = prompt("Digite o índice da tarefa a ser concluída");
                if (indice >= 0 && indice < tarefas.length) {
                    tarefas[indice] = "Concluída: " + tarefas[indice];
                    alert("Tarefa concluída com sucesso");
                } else {
                    alert("Índice inválido");
                }
                gerenciarTarefas();
            } else if (acao === "sair") {
                alert("Saindo do gerenciador de tarefas");
            } else {
                alert("Ação inválida. Tente novamente");
                gerenciarTarefas();
            }
        }

        gerenciarTarefas();
    </script>
</body>
</html>
